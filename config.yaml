# Configuration for wrf_to_zarr.py, verify_zarr.py and make_timeseries_store.py.
# The repo lives at /bsuhome/aflores/idaho-wrf-zarr. Relative paths below are relative to this
# file's folder; the Zarr stores go next to the data on /bsushare.
# Variable lists follow inventory/variables.csv from the 2026-10-10 inventory.
# Variables a store lists but the files lack are skipped with a warning and
# recorded in the store's attributes.

inventory_dir: inventory                       # output of wrf_inventory.py, inside the repo
# Source: /bsushare/leaf-shared/subset-output-wrf/volXX/wrf_out/wy_YYYY/d02 (12 volumes)
domain: d02                                            # the 1 km domain
duplicate_times: first                                 # first | last, when two files share an hour
# Only files whose path matches this regex feed the stores. The root also holds
# lev_interpolated/ (a WY2000-only test on 39 pressure levels) and wrf_allfield/
# (one complete wrfout for 1986-10-01, identical to wrf_out where they overlap).
include_paths: '/subset-output-wrf/vol\d+/wrf_out/'   # anchored: lev_interpolated/vol04/wrf_out/ must not match
# The complete wrfout: supplies the projection and XLAT/XLONG.
grid_file: /bsushare/leaf-shared/subset-output-wrf/vol01/wrf_allfield/wrfout_d02_1986-10-01_00:00:00
# Bucket sizes for I_<VAR> counters, used only if the files lack BUCKET_MM / BUCKET_J.
bucket_mm: 100.0             # the files also carry BUCKET_MM / BUCKET_J; these match them
bucket_j: 1000000000.0

output:
  root: /bsushare/leaf-shared/idaho-wrf-1km-zarr        # one <store>.zarr each; check quota first
  zarr_format: 3
  compressor: {cname: zstd, clevel: 3, shuffle: shuffle}   # Blosc; lossless

time:
  start: "1986-10-01T00:00"   # start of WY1987, the first folder on Borah
  end: "2017-09-30T23:00"     # end of WY2017
  freq_hours: 1

dataset_attrs:
  title: Idaho 1 km WRF reanalysis, WY1986-2017
  institution: Boise State University
  source: WRF driven by NARR
  references: Rudisill, Flores and McNamara 2021, doi:10.1175/JHM-D-20-0018.1

stores:
  # Lists set from the inventory of 2026-10-10: wrf_out holds 53 variables for the
  # full record; the other ~220 (P, PB, HFX, PBLH, LAI, ...) exist only in the
  # complete wrfout for 1986-10-01, which only the static store reads.
  static:
    # Read from the first output time; no time dimension.
    include_paths: wrf_allfield
    variables: [HGT, LANDMASK, XLAND, LU_INDEX, IVGTYP, ISLTYP, VEGFRA, SHDMAX, SHDMIN,
                COSALPHA, SINALPHA, MAPFAC_M, ZS, DZS, ZNU, ZNW,
                PHB]   # base-state geopotential: constant in time, so stored once here

  surface_met:
    chunks: {time: 24}            # one object per variable per day, full map
    hours_per_task: 720           # each SLURM array task writes 30 days
    variables: [T2, TH2, Q2, U10, V10, PSFC, TSK, SWDOWN, SWNORM, GLW, LWDNB, OLR, LH, GRDFLX, SR]
    accumulated: [RAINNC, RAINC, RAINSH, SNOWNC, GRAUPELNC, HAILNC]   # hourly amounts named <VAR>_1h
    derived:
      PRECIP:
        sum_of: [RAINNC, RAINC, RAINSH]
        units: mm
        long_name: hourly total precipitation
        standard_name: precipitation_amount

  land_hydro:
    chunks: {time: 24}
    hours_per_task: 720
    variables: [SNOW, SNOWH, SNOWC, ALBEDO, SNOALB, CANWAT, SMOIS, SH2O, TSLB, GDD]
    accumulated: [ACSNOM, SFROFF, UDROFF]

  atmos_3d:
    # No P or PB after the first day, so pressure on model levels can't be rebuilt
    # from this archive; PH + PHB (PHB in static) give geopotential height instead.
    chunks: {time: 1}             # a training sample reads one hour of the whole column
    shards: {time: 24}            # ...but objects on disk hold a day, to keep file counts down
    hours_per_task: 168
    # leaf-shared has a 150 TB hard quota that the NetCDF archive nearly fills, so this
    # store goes to scratch until the originals are retired. Check the scratch purge policy.
    root: /bsuscratch/aflores/idaho-wrf-1km-zarr
    mem: 32G                      # the pilot peaked at 16.8 GB per 168-hour task
    destagger: true               # put U, V, W, PH on the mass grid and levels
    variables: [U, V, W, T, PH, QVAPOR, QCLOUD, QRAIN, QSNOW, QICE, QGRAUP, QNICE, QNRAIN, CLDFRA]

timeseries:
  # make_timeseries_store.py: a copy chunked for long series at points.
  name: surface_timeseries
  from: {surface_met: [T2, Q2, PRECIP, SWDOWN], land_hydro: [SNOW, SNOWH, ACSNOM_1h]}
  chunks: {time: 8760, y: 32, x: 32}
